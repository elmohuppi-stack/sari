services:
  # Der Service heisst nicht "app". Compose setzt den Service-Namen in jedem
  # Netz als Alias, auch im geteilten hetzner-network. Dort trugen am
  # 8. August vier Container gleichzeitig den Alias "app" - Docker-DNS lieferte
  # sie im Wechsel, und knoras Frontend proxyte seine API-Calls reihum an
  # fremde Anwendungen. Im geteilten Netz muss der Servicename app-weit
  # eindeutig sein. container_name haelt den bisherigen Containernamen fest.
  sari:
    container_name: sari-app
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    env_file: .env
    restart: unless-stopped
    networks:
      - hetzner-network

networks:
  hetzner-network:
    external: true
