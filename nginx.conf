server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        alias /usr/share/nginx/html/data/;
        # Die JSON wechselt nur mit einem Deployment. 5 Minuten Cache reichen
        # für schnelle Wiederaufrufe, und must-revalidate verhindert, dass ein
        # Browser nach einem Deploy weiter die alte Datei zeigt.
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
}
